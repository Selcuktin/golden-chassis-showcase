name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Drizzle schema and migration snapshots
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle
          test -z "$(git ls-files --others --exclude-standard drizzle)"
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: D1 and R2 integration (local workerd)
        run: npm run test:integration
      - name: Production build
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit
