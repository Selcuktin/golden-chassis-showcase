# ByCar Etiler — Cloudflare Workers & D1 Database Configuration
name = "selcuktin-golden-chassis-showcase"
main = ".output/server/index.mjs"
compatibility_date = "2026-10-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [
  { pattern = "bycaretiler.com", custom_domain = true },
  { pattern = "www.bycaretiler.com/*", zone_name = "bycaretiler.com" },
]

[assets]
binding = "ASSETS"
directory = ".output/public"

# Cloudflare D1 Server Database
# D1 Veritabanı oluşturmak için terminalden:
# npx wrangler d1 create bycar_db
# Şema değişiklikleri yalnızca versioned migration ile uygulanır:
# npm run db:migrate:local
# npm run db:migrate:remote (reviewed production rollout only)
[[d1_databases]]
binding = "DB"
database_name = "bycar_db"
database_id = "cb9bbc34-a9ef-446e-b993-46405a7ca765"
migrations_dir = "drizzle"

# Cloudflare R2 Storage (Vehicle Images & Media)
# npx wrangler r2 bucket create bycar-media
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bycar-media"

[vars]
NODE_ENV = "production"
# Canonical origin for metadata, sitemap and permanent alias redirects.
SITE_URL = "https://bycaretiler.com"
CF_ACCESS_REQUIRED = "false"
# CF_ACCESS_TEAM_DOMAIN = "https://sami-app-pages.cloudflareaccess.com"
# CF_ACCESS_AUD = "b60d5e51dce3637ad067bdb9018f782e8bd574158aea2e65c573105850141065"
# CF_ACCESS_ALLOWED_EMAILS is stored as a Worker secret, not in Git.
