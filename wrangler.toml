# ByCar Global — Cloudflare Workers & D1 Database Configuration
name = "selcuktin-golden-chassis-showcase"
main = ".output/server/index.mjs"
compatibility_date = "2026-10-13"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = ".output/public"

# Cloudflare D1 Server Database
# D1 Veritabanı oluşturmak için terminalden:
# npx wrangler d1 create bycar_db
# D1 Şemasını uygulamak için:
# npx wrangler d1 execute bycar_db --file=./schema.sql
[[d1_databases]]
binding = "DB"
database_name = "bycar_db"
database_id = "cb9bbc34-a9ef-446e-b993-46405a7ca765"

# Cloudflare R2 Storage (Vehicle Images & Media)
# npx wrangler r2 bucket create bycar-media
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bycar-media"

[vars]
NODE_ENV = "production"
GIT_COMMIT = "5d1c5f6"
